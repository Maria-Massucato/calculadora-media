<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Média Escolar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Calculadora de Média</h1>
    <p class="subtitulo">Informe as duas notas bimestrais (0 a 10)</p>

    <label for="nota1">Nota 1</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex: 7.5" />

    <label for="nota2">Nota 2</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex: 8.0" />

    <button type="button" onclick="calcularMedia()">Calcular Média</button>

    <p id="resultado" class="resultado" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
